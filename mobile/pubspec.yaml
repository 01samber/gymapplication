name: sweatbox_gym
description: SweatBox Gym - Professional Fitness Management Platform
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI & Design
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  cached_network_image: ^3.3.1
  
  # State Management
  flutter_riverpod: ^2.4.9
  
  # Navigation
  go_router: ^13.0.1
  
  # Backend & Auth
  supabase_flutter: ^2.3.2
  
  # Local Storage
  shared_preferences: ^2.2.2
  
  # Date & Time
  intl: any
  
  # Charts & Visualization
  fl_chart: ^0.66.0
  
  # Utilities
  equatable: ^2.0.5
  crypto: ^3.0.3
  http: ^1.1.0
  video_player: ^2.8.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/videos/
